name: Check humanizer package

# GitHub Actions is not used: this repository buys no Actions credits.
# This workflow never runs on push or pull request. .githooks/pre-push runs
# the same checks locally and is the gate that enforces them. Restore the
# pull_request and push triggers here if Actions is ever funded again.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/humanizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check package files
        run: python3 scripts/validate-package.py
      - name: Check skill discovery
        run: npx --yes skills@1.5.20 add . --list
      - name: Check Claude marketplace
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .
